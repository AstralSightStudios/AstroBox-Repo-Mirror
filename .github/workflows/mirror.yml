name: Mirror AstroBox Repo

on:
  schedule:
    # nightly at 21:00 Beijing time (UTC+8), i.e. 13:00 UTC
    - cron: "0 13 * * *"
  workflow_dispatch:

concurrency:
  group: mirror-sync
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout mirror repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run mirror sync (push to org subrepos)
        run: python3 scripts/mirror.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ORG_GH_TOKEN: ${{ secrets.ASTROBOX_ORG_TOKEN }}
          MIRROR_ORG: AstroBox-Repo-Mirror

      - name: Commit and push bootstrap metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add edgeone.json mapping.json index.html scripts
          git diff --cached --quiet || git commit -m "chore: sync mirror $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
        env:
          GITHUB_TOKEN: ${{ github.token }}
