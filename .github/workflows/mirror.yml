name: Mirror AstroBox Repo

on:
  schedule:
    # every 6 hours, offset to avoid top-of-hour burst
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: mirror-sync
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout mirror repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run mirror sync
        run: python3 scripts/mirror.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: sync mirror $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
