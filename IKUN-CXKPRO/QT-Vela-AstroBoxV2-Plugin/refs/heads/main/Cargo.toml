[package]
name = "qt-abv2-plugin"
version = "0.1.3"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/IKUN-CXKPRO/QT-Vela-AstroBoxV2-Plugin"

[lib]
crate-type = ["cdylib"]

[dependencies]
astrobox-ng-wit = "0.2.1"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rqrr = "0.10"
