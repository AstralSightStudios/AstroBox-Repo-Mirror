<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AstroBox Mirror — 仓库资源镜像站</title>
<meta name="description" content="AstroBox 仓库资源镜像站：高速、稳定的镜像分发，让每一次获取都快如闪电。" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #efe9dd;
    --ink-soft: rgba(239, 233, 221, 0.58);
    --ink-faint: rgba(239, 233, 221, 0.4);
    --dark: #14120f;
    --accent: #d97757;
    --accent-glow: #e8a587;
    --serif: "Fraunces", "Noto Serif SC", "Songti SC", Georgia, serif;
    --mono: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", sans-serif;
    background: var(--dark);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  ::selection { background: var(--accent); color: var(--dark); }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 80px 24px 60px;
    position: relative;
  }

  main::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(239, 233, 221, 0.028) 1px, transparent 1px),
      linear-gradient(90deg, rgba(239, 233, 221, 0.028) 1px, transparent 1px);
    background-size: 72px 72px;
    mask-image: radial-gradient(ellipse 90% 70% at 50% 40%, black 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse 90% 70% at 50% 40%, black 30%, transparent 75%);
    pointer-events: none;
  }

  .glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    pointer-events: none;
  }
  .glow-1 {
    width: 560px; height: 560px;
    top: -12%; left: 50%;
    transform: translateX(-50%);
    background: radial-gradient(circle, rgba(217, 119, 87, 0.3), transparent 65%);
  }
  .glow-2 {
    width: 420px; height: 420px;
    bottom: -18%; right: -8%;
    background: radial-gradient(circle, rgba(232, 165, 135, 0.14), transparent 65%);
  }

  .eyebrow {
    position: relative;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.32em;
    color: var(--accent-glow);
    margin-bottom: 28px;
    display: flex;
    align-items: center;
    gap: 14px;
    opacity: 0;
    animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.15s forwards;
  }
  .eyebrow::before,
  .eyebrow::after {
    content: "";
    width: 36px; height: 1px;
    background: var(--accent);
  }

  h1 {
    position: relative;
    font-family: var(--serif);
    font-weight: 500;
    font-size: clamp(44px, 7vw, 88px);
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin-bottom: 26px;
    opacity: 0;
    animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.3s forwards;
  }
  h1 em {
    font-style: normal;
    background: linear-gradient(100deg, var(--accent-glow), var(--accent) 60%, #b85c3e);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .sub {
    position: relative;
    font-size: clamp(15px, 1.8vw, 18px);
    line-height: 1.75;
    color: var(--ink-soft);
    max-width: 560px;
    margin-bottom: 40px;
    opacity: 0;
    animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.45s forwards;
  }

  .cards {
    position: relative;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 16px;
    width: min(720px, 100%);
    margin-bottom: 44px;
    opacity: 0;
    animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.55s forwards;
  }

  .card {
    background: rgba(239, 233, 221, 0.04);
    border: 1px solid rgba(239, 233, 221, 0.12);
    border-radius: 16px;
    padding: 22px 24px;
    text-align: left;
    transition: border-color 0.3s, background 0.3s;
  }
  .card:hover {
    border-color: rgba(217, 119, 87, 0.5);
    background: rgba(217, 119, 87, 0.06);
  }
  .card .repo {
    font-family: var(--mono);
    font-size: 15px;
    color: var(--accent-glow);
    margin-bottom: 8px;
    word-break: break-all;
  }
  .card .stats {
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.7;
  }
  .card .stats b {
    color: var(--ink);
    font-weight: 600;
  }
  .card .url {
    display: inline-block;
    margin-top: 10px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-faint);
    text-decoration: none;
    transition: color 0.25s;
  }
  .card .url:hover { color: var(--accent-glow); }

  .cta {
    position: relative;
    opacity: 0;
    animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.6s forwards;
  }
  .btn {
    display: inline-block;
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.06em;
    padding: 15px 32px;
    border-radius: 999px;
    text-decoration: none;
    background: var(--accent);
    color: var(--dark);
    transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.3s;
  }
  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 40px rgba(217, 119, 87, 0.35);
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(26px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  footer {
    border-top: 1px solid rgba(239, 233, 221, 0.1);
    padding: 28px 24px;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 14px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--ink-faint);
  }
  footer a {
    color: var(--ink-soft);
    text-decoration: none;
    transition: color 0.25s;
  }
  footer a:hover { color: var(--accent-glow); }
</style>
</head>
<body>

<main>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
  <div class="eyebrow">MIRROR · SHARDS · 302</div>
  <h1>AstroBox<br /><em>资源镜像站</em></h1>
  <p class="sub">
    内容已按作者分仓存储，原访问路径自动 302 跳转到对应子站，无需任何改动。
  </p>
  <!-- SUBREPO_CARDS_START -->
  <div class="cards">
    <a class="card" href="https://mirror-01.abox.run">
      <div class="repo">mirror-01</div>
      <div class="stats"><b>14</b> 位作者 · <b>0.97 GiB</b></div>
      <span class="url">https://mirror-01.abox.run/ →</span>
    </a>
    <a class="card" href="https://mirror-02.abox.run">
      <div class="repo">mirror-02</div>
      <div class="stats"><b>80</b> 位作者 · <b>0.51 GiB</b></div>
      <span class="url">https://mirror-02.abox.run/ →</span>
    </a>
  </div>
<!-- SUBREPO_CARDS_END -->

  <div class="cta">
    <a class="btn" href="https://github.com/AstroBox-Repo-Mirror">前往组织仓库 →</a>
  </div>
</main>

<footer>
  <span>ASTROBOX MIRROR © 2026</span>
  <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">闽ICP备2024035715号-2</a>
</footer>

</body>
</html>
